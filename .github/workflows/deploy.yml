name: CI/CD - Build & Deploy to Elastic Beanstalk

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: us-east-1                      # change to your region
  EB_APPLICATION_NAME: mediatracker          # your EB application name
  EB_ENVIRONMENT_NAME: Mediatracker-env      # your EB environment name

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mediatracker
          POSTGRES_USER: mediatracker
          POSTGRES_PASSWORD: mediatracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run tests
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/mediatracker
          SPRING_DATASOURCE_USERNAME: mediatracker
          SPRING_DATASOURCE_PASSWORD: mediatracker
        run: ./gradlew test

      - name: Build JAR
        run: ./gradlew build -x test

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/libs/*.jar
          retention-days: 1

  deploy:
    name: Deploy to Elastic Beanstalk
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required to request the OIDC JWT
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: build/libs

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::118907880066:role/eb-cicd
          aws-region: ${{ env.AWS_REGION }}

      - name: Rename artifact for deploy
        run: |
          cd build/libs
          jar_file=$(ls *.jar | head -n 1)
          mv "$jar_file" application.jar

      - name: Generate deployment package version
        id: version
        run: echo "version=${GITHUB_SHA::8}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          # aws_access_key / aws_secret_key intentionally omitted: this action
          # falls back to the AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY /
          # AWS_SESSION_TOKEN already exported into the environment by the
          # configure-aws-credentials step above. Hardcoding them here would
          # drop the session token that OIDC's temporary credentials require.
          application_name: ${{ env.EB_APPLICATION_NAME }}
          environment_name: ${{ env.EB_ENVIRONMENT_NAME }}
          version_label: ${{ steps.version.outputs.version }}
          region: ${{ env.AWS_REGION }}
          deployment_package: build/libs/application.jar
          use_existing_version_if_available: true
          wait_for_deployment: true